<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141312">
<title>VDECK</title>
<style>
:root{
  --ink:#141312;
  --ink2:#1e1c1a;
  --ink3:#2a2724;
  --line:#3a3633;
  --fg:#efe9e0;
  --dim:#948c82;
  --amber:#e8a33d;
  --amber-d:#8a5f1d;
  --cut:#d9584a;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sys:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  --top:env(safe-area-inset-top);
  --bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:var(--ink);color:var(--fg);font-family:var(--sys);
  font-size:15px;line-height:1.5;
  display:flex;flex-direction:column;
  -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}

/* ---- header ---- */
header{
  padding:calc(var(--top) + 10px) 16px 10px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:10px;
  background:var(--ink2);
}
header h1{
  margin:0;font-family:var(--mono);font-size:15px;letter-spacing:.22em;
  font-weight:600;color:var(--amber);cursor:pointer;
  padding:2px 4px;margin:-2px -4px;border-radius:6px;
}
header h1:active{background:var(--ink3)}
header .sub{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.1em}
header .quota{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}

/* ---- panes ---- */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.pane{display:none;padding:14px 14px 24px}
.pane.on{display:block}

.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim);
  text-transform:uppercase;margin:2px 0 10px;display:flex;align-items:center;gap:8px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---- buttons ---- */
.btn{
  min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;
  background:var(--ink2);display:inline-flex;align-items:center;justify-content:center;
  gap:8px;font-size:14px;font-weight:600;
}
.btn:active{background:var(--ink3)}
.btn.pri{background:var(--amber);color:#231a08;border-color:var(--amber)}
.btn.pri:active{background:#c9871f}
.btn.cut{border-color:var(--cut);color:var(--cut)}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* ---- list rows ---- */
.card{
  display:flex;gap:12px;align-items:center;padding:10px;
  background:var(--ink2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
}
.card:active{background:var(--ink3)}
.thumb{
  width:82px;height:48px;flex:none;border-radius:7px;background:var(--ink3);
  object-fit:cover;display:block;
}
.thumb.ph{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--dim)}
.meta{flex:1;min-width:0}
.ttl{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub2{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px}
.card .more{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:20px}

.empty{
  border:1px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;color:var(--dim);
}
.empty b{display:block;color:var(--fg);font-size:14px;margin-bottom:6px}

/* ---- now playing ---- */
#stage{background:#000;position:relative}
#vid{width:100%;display:block;background:#000;max-height:44vh;object-fit:contain}
/* 切り出しモード中は映像を畳んで、波形に集中させる */
body.editing #vid{max-height:0;opacity:0}
body.editing #stage{height:0;overflow:hidden}
#npTitle{font-size:16px;font-weight:700;margin:14px 0 2px}
#npSrc{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:14px}

/* ---- 再生用シークバー（左右に余白を取って端を押しやすく） ---- */
.seekwrap{margin-top:16px}
.seekpad{padding:0 22px;height:40px;display:flex;align-items:center;touch-action:none}
.seektrack{position:relative;width:100%;height:6px;border-radius:3px;background:var(--ink3)}
.seekfill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--amber);width:0}
.seekknob{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
  background:var(--fg);border:2px solid var(--ink);left:0;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.splicepad{padding:0 22px}

/* ---- signature: the splice bar ---- */
.splice{position:relative;height:96px;margin:14px 0 4px;touch-action:none}
.splice .track{
  position:absolute;left:0;right:0;top:36px;height:54px;border-radius:4px;
  background:var(--ink2);border:1px solid var(--line);z-index:0;
}
#wave{position:absolute;left:0;top:36px;display:block;pointer-events:none;z-index:2}
.splice .sel{position:absolute;top:36px;height:54px;border-radius:4px;z-index:1;
  background:rgba(232,163,61,.10);border-left:2px solid var(--cut);border-right:2px solid var(--amber)}
.splice .play{position:absolute;top:32px;width:2px;height:62px;background:var(--fg);margin-left:-1px;z-index:3}
.flag{
  position:absolute;top:0;width:36px;height:32px;margin-left:-18px;z-index:4;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:700;
  border-radius:8px;background:var(--ink2);border:1px solid var(--cut);color:var(--cut);
}
.flag::after{content:"";position:absolute;top:32px;width:1px;height:58px;background:currentColor;opacity:.55}
.flag.out{border-color:var(--amber);color:var(--amber)}
.tc{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--dim)}
.tc b{color:var(--fg);font-weight:600}

/* ---- transport ---- */
#transport{
  border-top:1px solid var(--line);background:var(--ink2);
  padding:8px 12px calc(var(--bot) + 8px);
}
#tBar{height:14px;padding:5px 20px;margin-bottom:4px;box-sizing:content-box;
  background:none;cursor:pointer}
#tBarIn{height:4px;background:var(--ink3);border-radius:2px;overflow:hidden}
#tFill{height:100%;background:var(--amber);width:0}
.tRow{display:flex;align-items:center;gap:6px}
.tRow .np{flex:1;min-width:0}
.tRow .np .ttl{font-size:13px}
.ctl{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;color:var(--dim)}
.ctl svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.ctl:active{background:var(--ink3)}
.ctl.on{color:var(--amber)}
.ctl.big{background:var(--amber);color:#231a08}
.ctl.big svg{width:23px;height:23px}
.ctl#bPrev,.ctl#bNext{color:var(--fg)}

/* ---- tabs ---- */
nav{
  display:flex;border-top:1px solid var(--line);background:var(--ink2);
  padding-bottom:var(--bot);
}
nav button{
  flex:1;padding:9px 0 7px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;
  border-top:2px solid transparent;margin-top:-1px;min-height:52px;
}
nav button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--amber);border-top-color:var(--amber)}

/* ---- sheet ---- */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:40}
#veil.on{display:block}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--ink2);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:14px 14px calc(var(--bot) + 14px);transform:translateY(110%);
  transition:transform .22s ease;max-height:88vh;overflow-y:auto;
}
#sheet.on{transform:translateY(0)}
#sheet h3{margin:2px 0 12px;font-size:15px}
#sheet .opt{
  display:block;width:100%;text-align:left;padding:13px 12px;border-radius:10px;
  background:var(--ink3);margin-bottom:7px;font-size:14px;
}
#sheet .opt.danger{color:var(--cut)}
#sheet .opt{white-space:pre-line;line-height:1.45}
input[type=text]{
  width:100%;min-height:44px;padding:0 12px;border-radius:10px;
  background:var(--ink3);border:1px solid var(--line);
}
#toast{
  position:fixed;left:50%;bottom:calc(var(--bot) + 92px);transform:translate(-50%,14px);
  background:var(--fg);color:var(--ink);padding:9px 16px;border-radius:20px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hint{font-size:12px;color:var(--dim);line-height:1.6}
</style>
</head>
<body>

<header>
  <h1 id="brand">VDECK</h1>
  <span class="sub">v1</span>
  <span class="quota" id="quota"></span>
</header>

<main>
  <!-- LIBRARY -->
  <section class="pane on" id="pane-lib">
    <div class="eyebrow">ライブラリ</div>
    <div class="row" style="margin-bottom:14px">
      <label class="btn pri" style="flex:1">
        動画を取り込む
        <input type="file" id="pick" accept="video/*" multiple hidden>
      </label>
      <button class="btn" id="fixAll">調べ直す</button>
    </div>
    <div id="libList"></div>
  </section>

  <!-- CLIPS -->
  <section class="pane" id="pane-clip">
    <div class="eyebrow">切り出しクリップ</div>
    <div id="clipList"></div>
  </section>

  <!-- PLAYLISTS -->
  <section class="pane" id="pane-pl">
    <div class="eyebrow">再生リスト</div>
    <button class="btn wide" id="newPl" style="margin-bottom:14px">＋ 新しいリストを作る</button>
    <div id="plList"></div>
  </section>

  <!-- NOW PLAYING / EDITOR -->
  <section class="pane" id="pane-now" style="padding:0">
    <div id="stage"><video id="vid" playsinline webkit-playsinline preload="metadata"></video></div>
    <div style="padding:14px">
      <div id="npTitle">再生中の動画はありません</div>
      <div id="npSrc">ライブラリから選んでください</div>

      <!-- 再生用シークバー（IN/OUTとは完全に別物） -->
      <div class="seekwrap" id="seekWrap">
        <div class="seekpad">
          <div class="seektrack"><div class="seekfill" id="seekFill"></div>
            <div class="seekknob" id="seekKnob"></div></div>
        </div>
        <div class="tc"><b id="sNow">0:00</b><span id="sLeft">-0:00</span></div>
        <div class="row" style="justify-content:center;gap:10px;margin-top:2px">
          <button class="btn sm" id="b15b">15秒 戻す</button>
          <button class="btn sm" id="bSpeed">速度 1.0x</button>
          <button class="btn sm" id="b15f">15秒 送る</button>
        </div>
      </div>

      <button class="btn wide" id="toggleEdit" style="margin-top:16px">切り出しモードにする</button>

      <div id="editWrap" style="display:none">
        <div class="eyebrow">IN / OUT を決めて切り出す</div>
        <div class="splicepad">
          <div class="splice" id="splice">
            <canvas id="wave"></canvas>
            <div class="track"></div><div class="sel" id="sel"></div>
            <div class="play" id="ph"></div>
            <div class="flag" id="fIn">IN</div>
            <div class="flag out" id="fOut">OUT</div>
          </div>
        </div>
        <div class="tc" style="margin-top:2px">
          <span id="waveNote" style="font-size:11px">波形はまだ出してません</span>
        </div>
        <button class="btn sm" id="waveBtn" style="width:100%;margin-top:6px">音の波形を出す（無音の位置を探す）</button>
        <div class="tc">
          <span>IN <b id="tIn">0:00.0</b></span>
          <span id="tLen">0.0秒</span>
          <span>OUT <b id="tOut">0:00.0</b></span>
        </div>
        <p class="hint" style="margin:8px 0 0">このバーは IN / OUT 専用です。頭出しは上のシークバーでどうぞ。</p>
        <div class="row" style="margin-top:12px">
          <button class="btn sm" id="setIn">今ここをIN</button>
          <button class="btn sm" id="setOut">今ここをOUT</button>
          <button class="btn sm" id="prevSel">範囲を試聴</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn pri wide" id="saveClip">この範囲をクリップとして保存</button>
        </div>
        <p class="hint" style="margin-top:12px">
          クリップは「元動画＋開始/終了の位置」として保存されます。元ファイルは1本のまま増えないので、容量を食いません。
        </p>
      </div>

      <div id="queueWrap" style="margin-top:22px"></div>
    </div>
  </section>
</main>

<div id="transport">
  <div id="tBar"><div id="tBarIn"><div id="tFill"></div></div></div>
  <div class="tRow">
    <button class="ctl" id="bShuffle" aria-label="ランダム"><svg viewBox="0 0 24 24"><path d="M17 4l4 3-4 3"/><path d="M17 14l4 3-4 3"/><path d="M3 7h4l3 4"/><path d="M3 17h4l10-13h4"/><path d="M14 17h7"/></svg></button>
    <button class="ctl" id="bPrev" aria-label="前へ"><svg viewBox="0 0 24 24"><path d="M6 5v14" stroke-linecap="round"/><path d="M19 5.5v13a.7.7 0 0 1-1.1.6L8.5 12.6a.7.7 0 0 1 0-1.2l9.4-6.5a.7.7 0 0 1 1.1.6z" fill="currentColor" stroke="none"/></svg></button>
    <button class="ctl big" id="bPlay" aria-label="再生"><svg viewBox="0 0 24 24" id="icPlay"><path d="M7 4.5v15a.6.6 0 0 0 .93.5l11.5-7.5a.6.6 0 0 0 0-1L7.93 4a.6.6 0 0 0-.93.5z" fill="currentColor" stroke="none"/></svg></button>
    <button class="ctl" id="bNext" aria-label="次へ"><svg viewBox="0 0 24 24"><path d="M18 5v14" stroke-linecap="round"/><path d="M5 5.5v13a.7.7 0 0 0 1.1.6l9.4-6.5a.7.7 0 0 0 0-1.2L6.1 4.9A.7.7 0 0 0 5 5.5z" fill="currentColor" stroke="none"/></svg></button>
    <button class="ctl" id="bRepeat" aria-label="繰り返し"><svg viewBox="0 0 24 24" id="icRepeat"><path d="M17 2l4 4-4 4"/><path d="M3 12V10a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 12v2a4 4 0 0 1-4 4H3"/></svg></button>
    <div class="np"><div class="ttl" id="miniTitle">—</div>
      <div class="sub2" id="miniTime">0:00 / 0:00</div></div>
  </div>
</div>

<nav>
  <button class="on" data-p="lib"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 9v11"/></svg>LIBRARY</button>
  <button data-p="clip"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M8.2 7.6L20 18M8.2 16.4L20 6"/></svg>CLIPS</button>
  <button data-p="pl"><svg viewBox="0 0 24 24"><path d="M3 6h12M3 11h12M3 16h7"/><circle cx="17" cy="17" r="3"/><path d="M20 17V8l3 1"/></svg>LISTS</button>
  <button data-p="now"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.8v6.4l5-3.2z" fill="currentColor" stroke="none"/></svg>NOW</button>
</nav>

<div id="veil"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
"use strict";
/* ============ storage ============ */
const DBN="vdeck",DBV=2;let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,DBV);
 r.onupgradeneeded=e=>{const d=e.target.result;
  ["videos","clips","playlists","chunks"].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id"})});};
 r.onsuccess=e=>{db=e.target.result;res()};r.onerror=()=>rej(r.error);});}
function tx(s,m){return db.transaction(s,m).objectStore(s);}
function put(s,v){return new Promise((res,rej)=>{const r=tx(s,"readwrite").put(v);r.onsuccess=()=>res(v);r.onerror=()=>rej(r.error);});}
function del(s,id){return new Promise((res,rej)=>{const r=tx(s,"readwrite").delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error);});}
function all(s){return new Promise((res,rej)=>{const r=tx(s,"readonly").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
function one(s,id){return new Promise((res,rej)=>{const r=tx(s,"readonly").get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ============ state ============ */
let VIDEOS=[],CLIPS=[],PLAYLISTS=[];
let queue=[],qi=-1,shuffle=false,repeat="off",curURL=null,curVid=null;
let ed=null; // {videoId,dur,inT,outT}

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const vid=$("#vid");

function fmt(t){if(!isFinite(t)||t<0)t=0;const m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+String(s).padStart(2,"0");}
function fmt1(t){if(!isFinite(t)||t<0)t=0;const m=Math.floor(t/60),s=(t%60).toFixed(1).padStart(4,"0");return m+":"+s;}
function mb(b){return b>=1073741824?(b/1073741824).toFixed(1)+"GB":Math.round(b/1048576)+"MB";}
let tT;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("on"),1800);}

/* ============ sheet ============ */
function sheet(title,opts){
  const s=$("#sheet");s.innerHTML="<h3>"+title+"</h3>";
  opts.forEach(o=>{const b=document.createElement("button");b.className="opt"+(o.danger?" danger":"");
    b.textContent=o.label;b.onclick=()=>{closeSheet();setTimeout(o.fn,180)};s.appendChild(b);});
  const c=document.createElement("button");c.className="opt";c.textContent="キャンセル";c.onclick=closeSheet;s.appendChild(c);
  $("#veil").classList.add("on");requestAnimationFrame(()=>s.classList.add("on"));
}
function sheetInput(title,ph,val,fn){
  const s=$("#sheet");s.innerHTML="<h3>"+title+"</h3>";
  const i=document.createElement("input");i.type="text";i.placeholder=ph;i.value=val||"";s.appendChild(i);
  const r=document.createElement("div");r.className="row";r.style.marginTop="10px";
  const ok=document.createElement("button");ok.className="btn pri";ok.style.flex="1";ok.textContent="決定";
  ok.onclick=()=>{const v=i.value.trim();if(!v)return;closeSheet();setTimeout(()=>fn(v),180)};
  const ng=document.createElement("button");ng.className="btn";ng.textContent="やめる";ng.onclick=closeSheet;
  r.append(ok,ng);s.appendChild(r);
  $("#veil").classList.add("on");requestAnimationFrame(()=>s.classList.add("on"));
  setTimeout(()=>i.focus(),260);
}
function closeSheet(){$("#sheet").classList.remove("on");$("#veil").classList.remove("on");}
$("#veil").onclick=closeSheet;

/* 車で使えているか確かめる */
function carDiag(){
  const ms=("mediaSession" in navigator);
  let handlers="不明";
  if(ms){
    try{navigator.mediaSession.setActionHandler("nexttrack",()=>next());handlers="受け付けています"}
    catch(_){handlers="受け付けられません"}
  }
  const meta=ms&&navigator.mediaSession.metadata;
  sheet("車での再生 診断",[
    "曲情報の窓口\n"+(ms?"使えます":"使えません（このブラウザは未対応）"),
    "ステアリング操作の受け口\n"+handlers,
    "ナビに送っている曲名\n"+(meta?meta.title:"未設定"),
    "ナビに送っている元動画名\n"+(meta&&meta.artist?meta.artist:"未設定"),
    "ジャケット画像\n"+(meta&&meta.artwork&&meta.artwork.length?"送っています":"なし（サムネ未設定）"),
    "再生状態\n"+((ms&&navigator.mediaSession.playbackState)||"未設定"),
    "音量\n"+Math.round(vid.volume*100)+"%"+(vid.muted?"（消音中）":""),
  ].map(t=>({label:t,fn:()=>{}})));
}

/* ヘッダーのVDECKをタップ → 更新メニュー
   ホーム画面から起動するとアドレスバーが無く、更新手段が無くなるため */
$("#brand").onclick=()=>{
  sheet("VDECK v1",[
    {label:"再読み込み",fn:()=>location.reload()},
    {label:"車での再生を診断する",fn:()=>carDiag()},
    {label:"強制更新（キャッシュを捨てて最新を取得）",fn:async()=>{
      try{

const CHUNK=8*1048576;
let lastErr="";
async function store(f){
  const id=uid(),type=f.type||"video/mp4";
  const n=Math.max(1,Math.ceil(f.size/CHUNK));
  lastErr="";
  try{
    for(let i=0;i<n;i++){
      const buf=await f.slice(i*CHUNK,Math.min(f.size,(i+1)*CHUNK)).arrayBuffer();
      await put("chunks",{id:id+":"+i,data:buf});
      if(n>4&&i%3===0)toast(f.name.slice(0,16)+" 保存中 "+Math.round((i+1)/n*100)+"%");
    }
    await put("videos",{id,name:f.name.replace(/\.[^.]+$/,""),
      type,size:f.size,chunks:n,dur:0,thumb:null,addedAt:Date.now()});
    return id;
  }catch(err){
    for(let i=0;i<n;i++){try{await del("chunks",id+":"+i)}catch(_){}}
    const nm=(err&&err.name)||String(err);
    lastErr=nm==="QuotaExceededError"?"保存領域がいっぱいです":"保存に失敗 "+nm;
    toast(lastErr);
    return null;
  }
}
/* 分割保存されたものを1本に組み直す */
/* 分割保存されたものを1本に組み直す
   かけらを1個ずつ継ぎ足すと、そのたびに全体を作り直すことになって
   本数の二乗ぶんの手間がかかる。まとめて一度に渡すこと。 */
let blobCache={id:null,blob:null};
async function blobOf(rec){
  if(!rec)return null;
  if(blobCache.id===rec.id&&blobCache.blob)return blobCache.blob;
  let b=null;
  if(rec.chunks){
    const parts=[];
    for(let i=0;i<rec.chunks;i++){
      const c=await one("chunks",rec.id+":"+i);
      if(!c)return null;
      parts.push(c.data);
    }
    b=new Blob(parts,{type:rec.type||"video/mp4"});   // 一度だけ作る
  }
  else if(rec.data)b=new Blob([rec.data],{type:rec.type||"video/mp4"});
  else b=rec.blob||null;
  blobCache={id:rec.id,blob:b};
  return b;
}
async function dropVideo(v){
  if(blobCache.id===v.id)blobCache={id:null,blob:null};
  await del("videos",v.id);
  if(v.chunks)for(let i=0;i<v.chunks;i++){try{await del("chunks",v.id+":"+i)}catch(_){}}
  for(const c of CLIPS.filter(c=>c.videoId===v.id))await del("clips",c.id);
}

/* mp4の箱構造をたどって、先頭8〜16バイトだけ読む */
async function readBox(blob,off){
  const buf=await blob.slice(off,off+16).arrayBuffer();
  if(buf.byteLength<8)return null;
  const d=new DataView(buf);
  let size=d.getUint32(0),hs=8;
  const type=String.fromCharCode(d.getUint8(4),d.getUint8(5),d.getUint8(6),d.getUint8(7));
  if(size===1){if(buf.byteLength<16)return null;size=Number(d.getBigUint64(8));hs=16;}
  else if(size===0)size=blob.size-off;
  return {size,type,hs};
}
/* mvhd に書いてある「本当の長さ」を読む。再生不要・一瞬で終わる */
async function mp4Duration(blob){
  try{
    let off=0;
    while(off<blob.size){
      const b=await readBox(blob,off);
      if(!b||b.size<8)return 0;
      if(b.type==="moov"){
        let o=off+b.hs;const end=off+b.size;
        while(o<end){
          const c=await readBox(blob,o);
          if(!c||c.size<8)return 0;
          if(c.type==="mvhd"){
            const d=new DataView(await blob.slice(o+c.hs,o+c.hs+32).arrayBuffer());
            const ver=d.getUint8(0);
            const ts=ver===1?d.getUint32(20):d.getUint32(12);
            const du=ver===1?Number(d.getBigUint64(24)):d.getUint32(16);
            return ts>0?du/ts:0;
          }
          o+=c.size;
        }
        return 0;
      }
      off+=b.size;
    }
  }catch(_){}
  return 0;
}

function seekTo(v,t){return new Promise(r=>{
  let f=false;const h=()=>{if(f)return;f=true;v.removeEventListener("seeked",h);clearTimeout(to);r()};
  const to=setTimeout(h,5000);
  v.addEventListener("seeked",h);
  try{v.currentTime=t}catch(_){h()}
});}

/* mp4の「長さのメモ」が嘘のことがあるので、末尾へ飛ばして実測する */
function trueDuration(v){return new Promise(r=>{
  let f=false;
  const fin=()=>{if(f)return;f=true;
    v.removeEventListener("seeked",sk);v.removeEventListener("durationchange",dc);clearTimeout(to);
    const d=isFinite(v.duration)&&v.duration>0?v.duration:0;
    r(d);};
  const sk=()=>fin(),dc=()=>{};
  const to=setTimeout(fin,25000);
  v.addEventListener("seeked",sk);v.addEventListener("durationchange",dc);
  try{v.currentTime=1e101}catch(_){fin()}
});}

function probe(src){
  return new Promise(res=>{
    const u=URL.createObjectURL(src),v=document.createElement("video");
    v.muted=true;v.defaultMuted=true;v.playsInline=true;
    v.setAttribute("playsinline","");v.setAttribute("webkit-playsinline","");
    v.preload="auto";
    v.style.cssText="position:fixed;left:-9999px;top:0;width:4px;height:4px;opacity:0.01;pointer-events:none";
    document.body.appendChild(v);
    let f=false;
    const fin=r=>{if(f)return;f=true;clearTimeout(to);
      try{v.pause()}catch(_){}
      URL.revokeObjectURL(u);v.removeAttribute("src");
      try{v.load()}catch(_){}
      v.remove();res(r);};
    const to=setTimeout(()=>fin({dur:0,thumb:null,err:"timeout"}),45000);
    v.onerror=()=>fin({dur:0,thumb:null,err:(v.error&&v.error.code===4)?"codec":"read"});
    v.onloadedmetadata=async()=>{
      try{
        try{await v.play()}catch(_){}          // iOSにデコードさせる
        let dur=await mp4Duration(src);         // 設計図から読む（速い・正確）
        if(!dur||!isFinite(dur))dur=await trueDuration(v);  // ダメなら実測に落とす
        const t=dur>0?Math.min(dur*0.1,5):0;
        await seekTo(v,t);
        try{v.pause()}catch(_){}
        let thumb=null;
        try{
          const w=320,h=Math.round(w*((v.videoHeight/v.videoWidth)||0.5625))||180;
          const c=document.createElement("canvas");c.width=w;c.height=h;
          c.getContext("2d").drawImage(v,0,0,w,h);
          const d=c.toDataURL("image/jpeg",.6);
          if(d&&d.length>2000)thumb=d;          // 真っ黒は捨てる
        }catch(_){}
        fin({dur,thumb});
      }catch(_){fin({dur:0,thumb:null,err:"read"})}
    };
    v.src=u;
  });
}

/* 保存されたデータが本当に揃っているか数える */
async function diagnose(rec){
  toast("調べてます…");
  let found=0,bytes=0;
  if(rec.chunks){
    for(let i=0;i<rec.chunks;i++){
      const c=await one("chunks",rec.id+":"+i);
      if(c&&c.data){found++;bytes+=c.data.byteLength;}
    }
  }else if(rec.data){found=1;bytes=rec.data.byteLength;}
  const b=await blobOf(rec);
  const hdr=b?await mp4Duration(b):0;
  const okAll=bytes===rec.size;
  sheet("診断： "+rec.name,[
    "元ファイルのサイズ\n"+rec.size.toLocaleString()+" B（"+mb(rec.size)+"）",
    "実際に入ってるデータ\n"+bytes.toLocaleString()+" B（"+mb(bytes)+"）",
    "かけらの数\n"+found+" / "+(rec.chunks||1),
    "組み直した結果\n"+(b?b.size.toLocaleString()+" B":"組み直し失敗"),
    "設計図に書いてある長さ\n"+(hdr?fmt(hdr):"読み取れず"),
    "いま表示してる長さ\n"+fmt(rec.dur||0),
    okAll?"データは欠けてません":"データが不足しています： "+mb(rec.size-bytes)+" 足りません"
  ].map(t=>({label:t,fn:()=>{}})));
}
async function repair(rec,quiet){
  const b=await blobOf(rec);
  if(!b||!b.size){if(!quiet)toast("データがありません");return;}
  if(!quiet)toast("調べ直してます… "+rec.name);
  const p=await probe(b);
  if(p.dur)rec.dur=p.dur;
  if(p.thumb)rec.thumb=p.thumb;
  await put("videos",rec);
  if(!quiet){await reload();toast(p.dur?"長さ "+fmt(p.dur)+" に修正":"読み取れませんでした")}
}

/* 車のステアリングスイッチ・Bluetooth機器・ロック画面からの操作を受ける */
/* 画面を消して戻したときに窓口が外れることがあるので張り直す */
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    mediaSetup();mediaState();mediaPos();
    const it=queue[qi];if(it)mediaInfo(it);
  }
});

function mediaSetup(){
  if(!("mediaSession" in navigator))return;
  const ms=navigator.mediaSession;
  const set=(k,fn)=>{try{ms.setActionHandler(k,fn)}catch(_){}};
  set("play",()=>vid.play().catch(()=>{}));
  set("pause",()=>vid.pause());
  set("stop",()=>vid.pause());
  set("nexttrack",()=>next());
  set("previoustrack",()=>prev());
  set("seekforward",e=>{const it=queue[qi];if(!it)return;
    const en=it.end||vid.duration||0;
    vid.currentTime=Math.min(en-0.1,vid.currentTime+((e&&e.seekOffset)||15));});
  set("seekbackward",e=>{const it=queue[qi];if(!it)return;
    vid.currentTime=Math.max(it.start||0,vid.currentTime-((e&&e.seekOffset)||15));});
  set("seekto",e=>{const it=queue[qi];if(!it||!e||e.seekTime==null)return;
    vid.currentTime=(it.start||0)+e.seekTime;});
}

/* ナビ画面やロック画面に曲名とサムネを出す */
function mediaInfo(it){
  if(!("mediaSession" in navigator)||!it)return;
  const v=VIDEOS.find(v=>v.id===it.videoId);
  const art=it.thumb||(v&&v.thumb);
  const meta={title:it.title||"VDECK",artist:v?v.name:"VDECK",album:"VDECK"};
  if(art)meta.artwork=[{src:art,sizes:"320x180",type:"image/jpeg"}];
  try{navigator.mediaSession.metadata=new MediaMetadata(meta)}catch(_){}
}
function mediaState(){
  if(!("mediaSession" in navigator))return;
  try{navigator.mediaSession.playbackState=vid.paused?"paused":"playing"}catch(_){}
}
function mediaPos(){
  if(!("mediaSession" in navigator)||!navigator.mediaSession.setPositionState)return;
  const it=queue[qi];if(!it)return;
  const s=it.start||0,en=it.end||vid.duration||0;
  const dur=Math.max(0,en-s);
  if(!isFinite(dur)||dur<=0)return;
  try{navigator.mediaSession.setPositionState({
    duration:dur,playbackRate:vid.playbackRate||1,

/* ===== 音の波形（無音の位置を見つけるため） ===== */
let waveFor=null,waveData=null,waveBusy=false,waveAbort=false;
const WAVE_N=900;

/* 走査は重いので、別の作業場（Worker）に投げてアプリ本体を止めない */
let waveWorker=null;
function getWaveWorker(){
  if(waveWorker)return waveWorker;
  const src=`
    self.onmessage=e=>{
      const {ch,N}=e.data;
      const peaks=new Float32Array(N);
      const step=Math.max(1,Math.floor(ch.length/N));
      let max=0;
      for(let i=0;i<N;i++){
        let p=0;const a0=i*step,a1=Math.min(ch.length,a0+step);
        for(let j=a0;j<a1;j++){const a=ch[j]<0?-ch[j]:ch[j];if(a>p)p=a;}
        peaks[i]=p;if(p>max)max=p;
        if((i&63)===0)self.postMessage({progress:(i+1)/N});
      }
      if(max>0)for(let i=0;i<N;i++)peaks[i]/=max;
      self.postMessage({done:true,peaks,max},[peaks.buffer]);
    };`;
  try{
    waveWorker=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));
  }catch(_){waveWorker=null}
  return waveWorker;
}

async function buildWave(videoId,dur){
  if(waveBusy){waveAbort=true;return;}
  waveBusy=true;waveAbort=false;waveFor=videoId;waveData=null;
  const note=$("#waveNote");
  const AC=window.AudioContext||window.webkitAudioContext;
  try{
    if(!AC)throw new Error("no-audio");
    const rec=await one("videos",videoId);
    const b=await blobOf(rec);
    if(!b)throw new Error("no-data");

    note.textContent="音を読み込んでます…";
    drawWave();
    await new Promise(r=>setTimeout(r,60));
    const bytes=await b.arrayBuffer();

    note.textContent="音を展開してます…";
    await new Promise(r=>setTimeout(r,60));

    // 8kHzで展開する。波形を見るには十分で、データ量は6分の1以下になる
    let buf=null;
    try{
      const lo=new AC({sampleRate:8000});
      buf=await lo.decodeAudioData(bytes.slice(0));
      try{lo.close()}catch(_){}
    }catch(_){ }
    if(!buf){
      const ctx=new AC();
      buf=await ctx.decodeAudioData(bytes);
      try{ctx.close()}catch(_){}
    }
    const ch=Float32Array.from(buf.getChannelData(0));
    buf=null;

    const w=getWaveWorker();
    if(w){
      const peaks=await new Promise((res,rej)=>{
        const to=setTimeout(()=>rej(new Error("timeout")),180000);
        w.onmessage=ev=>{
          if(ev.data.progress!==undefined){
            note.textContent="音を解析中… "+Math.round(ev.data.progress*100)+"%";
            return;
          }
          clearTimeout(to);res(ev.data.max>0?ev.data.peaks:null);
        };
        w.onerror=()=>{clearTimeout(to);rej(new Error("worker"))};
        w.postMessage({ch,N:WAVE_N},[ch.buffer]);
      });
      waveData=peaks;
    }else{
      // Workerが使えない環境向けの保険（少しずつ区切って走査する）
      const peaks=new Float32Array(WAVE_N);
      const step=Math.max(1,Math.floor(ch.length/WAVE_N));
      let max=0;
      for(let i=0;i<WAVE_N;i++){
        let p=0;const a0=i*step,a1=Math.min(ch.length,a0+step);
        for(let j=a0;j<a1;j++){const a=ch[j]<0?-ch[j]:ch[j];if(a>p)p=a;}
        peaks[i]=p;if(p>max)max=p;
        if((i&31)===0){
          note.textContent="音を解析中… "+Math.round((i+1)/WAVE_N*100)+"%";
          await new Promise(r=>setTimeout(r,0));
        }
      }
      if(max>0){for(let i=0;i<WAVE_N;i++)peaks[i]/=max;waveData=peaks;}
    }

    note.textContent=waveData?"濃い谷が無音です":
      "音を読み取れませんでした（音声が無いか、展開できない形式です）";
  }catch(e){
    waveData=null;
    const m=(e&&e.message)||String(e);
    note.textContent=
      m==="no-audio"?"このブラウザは音の解析に対応してません":
      m==="no-data" ?"元動画のデータが見つかりません":
      m==="timeout" ?"解析に時間がかかりすぎました":
      /memory|allocat/i.test(m)?"音が大きすぎて解析できませんでした":
      "波形を出せません（"+m+"）";
  }
  waveBusy=false;waveDirty=true;drawWave(true);
}

let waveDirty=true,waveW=0,mpTick=0;
function drawWave(force){
  const cv=$("#wave");if(!cv||!ed)return;
  const r=cv.parentElement.getBoundingClientRect();
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(1,Math.round(r.width)),h=54;
  // 幅が変わったときだけ作り直す（毎回だと重い）
  if(w!==waveW){
    cv.style.width=w+"px";cv.style.height=h+"px";
    cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
    waveW=w;waveDirty=true;
  }
  if(!waveDirty&&!force)return;
  waveDirty=false;
  const g=cv.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);

  const cs=getComputedStyle(document.body);
  const dim=cs.getPropertyValue("--dim").trim()||"#948c82";
  const amber=cs.getPropertyValue("--amber").trim()||"#e8a33d";
  const line=cs.getPropertyValue("--line").trim()||"#3a3633";

  if(!waveData){
    g.strokeStyle=line;g.lineWidth=1;
    g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();
    return;
  }
  const N=waveData.length,mid=h/2;
  const inX=ed.dur?(ed.inT/ed.dur)*w:0, outX=ed.dur?(ed.outT/ed.dur)*w:w;
  for(let x=0;x<w;x++){
    const v=waveData[Math.min(N-1,Math.floor(x/w*N))];
    const bar=Math.max(0.7,v*(h/2-2));
    const inSel=x>=inX&&x<=outX;
    g.strokeStyle=inSel?amber:dim;
    g.globalAlpha=inSel?0.95:0.32;
    g.beginPath();g.moveTo(x+.5,mid-bar);g.lineTo(x+.5,mid+bar);g.stroke();
  }
  g.globalAlpha=1;
  // 無音とみなせる帯を薄く塗る
  g.fillStyle=line;
  for(let x=0;x<w;x++){
    const v=waveData[Math.min(N-1,Math.floor(x/w*N))];
    if(v<0.04)g.fillRect(x,h-3,1,3);
  }
}

function drawEd(withWave){

(function drag(){
  const bar=$("#splice");let mode=null;
  const tAt=e=>{const r=bar.getBoundingClientRect();
    return Math.max(0,Math.min(ed.dur,((e.clientX-r.left)/r.width)*ed.dur));};
  bar.addEventListener("pointerdown",e=>{
    if(!ed||!ed.dur)return;
    e.preventDefault();bar.setPointerCapture(e.pointerId);
    const r=bar.getBoundingClientRect(),x=e.clientX-r.left;
    const pIn=(ed.inT/ed.dur)*r.width,pOut=(ed.outT/ed.dur)*r.width;
    // このバーは IN/OUT 専用。必ず近いほうの旗を掴む（シークはしない）
    mode=Math.abs(x-pIn)<=Math.abs(x-pOut)?"in":"out";
    move(e);
  });
  bar.addEventListener("pointermove",e=>{if(mode){e.preventDefault();move(e)}});
  bar.addEventListener("pointerup",()=>mode=null);
  bar.addEventListener("pointercancel",()=>mode=null);
  function move(e){
    const t=tAt(e);
    if(mode==="in")ed.inT=Math.min(t,ed.outT-0.1);
    else ed.outT=Math.max(t,ed.inT+0.1);
    drawEd(true);
  }
})();

(function seekBar(){

/* 指定位置のコマを取り出してサムネにする */
async function grabFrame(blob,t){
  return new Promise(res=>{
    const u=URL.createObjectURL(blob),v=document.createElement("video");
    v.muted=true;v.defaultMuted=true;v.playsInline=true;
    v.setAttribute("playsinline","");v.setAttribute("webkit-playsinline","");
    v.preload="auto";
    v.style.cssText="position:fixed;left:-9999px;top:0;width:4px;height:4px;opacity:.01;pointer-events:none";
    document.body.appendChild(v);
    let f=false;
    const fin=r=>{if(f)return;f=true;clearTimeout(to);
      try{v.pause()}catch(_){}
      URL.revokeObjectURL(u);v.removeAttribute("src");
      try{v.load()}catch(_){}
      v.remove();res(r);};
    const to=setTimeout(()=>fin(null),20000);
    v.onerror=()=>fin(null);
    v.onloadedmetadata=async()=>{
      try{
        try{await v.play()}catch(_){}
        await seekTo(v,Math.max(0,t));
        try{v.pause()}catch(_){}
        const w=320,h=Math.round(w*((v.videoHeight/v.videoWidth)||0.5625))||180;
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(v,0,0,w,h);
        const d=c.toDataURL("image/jpeg",.6);
        fin(d&&d.length>2000?d:null);
      }catch(_){fin(null)}
    };
    v.src=u;
  });
}

  if(navigator.storage&&navigator.storage.estimate){

    $("#quota").textContent=mb(e.usage||0)+" 使用中";
  }
}
window.addEventListener("resize",()=>ed&&drawEd(true));
openDB().then(reload).then(syncBtns).then(mediaSetup).catch(e=>{
  document.body.innerHTML='<p style="padding:40px;color:#e8a33d;font-family:sans-serif">保存領域が使えませんでした。Safariのプライベートブラウズを解除してから開き直してください。<br><br>'+e+'</p>';
});
